<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活照片 · 岳鹏</title>
    <meta name="description" content="岳鹏的生活照片 —— 镜头下的生活瞬间。">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

    <div class="bg-aurora" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="../index.html" class="logo">
                <span class="logo-mark">YP</span>
                <span>岳鹏</span>
            </a>
            <button class="nav-toggle" aria-label="菜单" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-menu">
                <a href="../index.html">首页</a>
                <a href="about.html">关于我</a>
                <a href="life.html">生平</a>
                <a href="assets.html">资产</a>
                <a href="gallery.html">照片</a>
                <a href="contact.html">联系</a>
            </div>
        </div>
    </nav>

    <header class="page-hero">
        <div class="container">
            <h1><span class="grad-text">生活照片</span></h1>
            <p>镜头下的生活瞬间，点击图片可全屏预览。</p>
        </div>
    </header>

    <main class="section" style="padding-top: 30px;">
        <div class="container">
            <div class="gallery">
                <div class="gallery-item reveal">
                    <img src="../zhaopian/yp01.jpg" alt="生活照 · 岳鹏" loading="lazy">
                    <div class="g-cap">生活照</div>
                </div>
                <div class="gallery-item reveal d1">
                    <img src="../zhaopian/yp03.jpeg" alt="生活照 · 岳鹏" loading="lazy">
                    <div class="g-cap">孤独的背影</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="copy">© <span class="js-year">2025</span> 岳鹏 · 用心生活，认真成长</div>
            <div class="foot-links">
                <a href="../index.html">首页</a>
                <a href="about.html">关于我</a>
                <a href="contact.html">联系</a>
            </div>
        </div>
    </footer>

    <button class="back-to-top" aria-label="返回顶部">↑</button>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
        <button class="lb-btn lb-close" aria-label="关闭">✕</button>
        <button class="lb-btn lb-prev" aria-label="上一张">‹</button>
        <img id="lightboxImg" alt="">
        <button class="lb-btn lb-next" aria-label="下一张">›</button>
        <span class="lb-count" id="lightboxCount"></span>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
